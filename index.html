:root {
  --paper: #FAF7F0;
  --paper-2: #F1EDE2;
  --ink: #161310;
  --ink-2: #2C2823;
  --muted: #786F63;
  --rule: rgba(22, 19, 16, 0.16);
  --rule-strong: rgba(22, 19, 16, 0.55);
  --accent: #161310; /* default: black ink, restrained */
  --accent-soft: rgba(22, 19, 16, 0.06);
  --serif: "EB Garamond", "Garamond", "Times New Roman", Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --pad-x: clamp(20px, 4vw, 56px);
  --max-w: 1280px;
}

[data-paper="on"] body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(rgba(31,27,22,0.025) 1px, transparent 1px),
    radial-gradient(rgba(31,27,22,0.018) 1px, transparent 1px);
  background-size: 3px 3px, 7px 7px;
  background-position: 0 0, 1.5px 1.5px;
  mix-blend-mode: multiply;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--serif);
  font-size: 18px;
  line-height: 1.55;
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: inherit; text-decoration: none; }
a.link { border-bottom: 1px solid var(--rule-strong); padding-bottom: 1px; }
a.link:hover { color: var(--accent); border-color: var(--accent); }

/* Inline text link (button styled as text) with animated underline on hover */
.text-link {
  display: inline; padding: 0; margin: 0; border: 0;
  background: none; color: inherit; font: inherit; cursor: pointer;
  position: relative;
}
.text-link::after {
  content: ""; position: absolute; left: 0; bottom: -1px;
  width: 100%; height: 1px; background: currentColor;
  transform: scaleX(0); transform-origin: left;
  transition: transform 240ms ease;
}
.text-link:hover::after { transform: scaleX(1); }

button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

img, iframe { max-width: 100%; }
img { height: auto; display: block; }

.shell {
  position: relative;
  z-index: 1;
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 var(--pad-x);
}

/* ---------- Nav (dark) ---------- */
.nav {
  background: var(--ink);
  color: var(--paper);
  position: sticky; top: 0; z-index: 50;
  /* Promote to its own compositing layer so it repaints cleanly over
     scrolling content (fixes intermittent sticky-header smearing) */
  transform: translateZ(0);
  -webkit-transform: translateZ(0);
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}
.nav-top-bar {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  padding: 22px 0 18px;
  gap: 24px;
}
.nav-top-bar .nav-links { justify-self: center; }
.nav-top-bar .nav-search-wrap { justify-self: end; }
.brand {
  display: flex; align-items: center; gap: 14px;
  cursor: pointer;
}
.brand-logo {
  height: 52px; width: auto; display: block;
  max-width: none; /* never squash horizontally when the header row tightens */
  filter: invert(1) brightness(1.1);
}

/* Narrow desktop (above the burger breakpoint): shrink logo/search/links
   proportionally instead of letting the logo compress */
@media (max-width: 1120px) and (min-width: 881px) {
  .brand-logo { height: 42px; }
  .nav-search-input { width: 130px; }
  .nav-link { padding: 10px 12px; letter-spacing: 0.2em; }
  .nav-top-bar { gap: 16px; }
}

.nav-links {
  display: flex; align-items: center; gap: 0;
}
.nav-link {
  font-family: var(--serif);
  font-size: 14px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  padding: 10px 18px;
  color: rgba(250, 247, 240, 0.7);
  position: relative;
}
.nav-link[aria-current="page"] { color: var(--paper); }
.nav-link:hover { color: var(--paper); }

/* Desktop nav search */
.nav-search-wrap {
  display: flex; align-items: center; gap: 2px;
  border-bottom: 1px solid rgba(250, 247, 240, 0.38);
  padding-bottom: 2px;
}
.nav-search-input {
  background: transparent;
  border: none; outline: none;
  color: var(--paper);
  font-family: var(--serif);
  font-size: 16px;
  letter-spacing: 0.02em;
  padding: 2px 0;
  width: 200px;
}
.nav-search-input::placeholder { color: rgba(250, 247, 240, 0.4); }
.nav-search-btn {
  background: transparent; border: none;
  color: rgba(250, 247, 240, 0.65);
  padding: 2px 6px; cursor: pointer;
  display: flex; align-items: center;
}
.nav-search-btn:hover { color: var(--paper); }

/* Mobile nav search bar */
.nav-search-mobile-bar {
  display: none;
  width: 100%;
  padding: 8px 0 10px;
  gap: 8px; align-items: center;
  border-top: 1px solid rgba(250, 247, 240, 0.18);
  border-bottom: 1px solid rgba(250, 247, 240, 0.22);
}
.nav-search-mobile-input {
  flex: 1;
  background: rgba(250, 247, 240, 0.09);
  border: 1px solid rgba(250, 247, 240, 0.22);
  border-radius: 2px;
  outline: none;
  color: var(--paper);
  font-family: var(--serif);
  font-size: 16px;
  padding: 8px 12px;
  letter-spacing: 0.01em;
}
.nav-search-mobile-input::placeholder { color: rgba(250, 247, 240, 0.45); }
.nav-search-mobile-btn {
  background: rgba(250, 247, 240, 0.09);
  border: 1px solid rgba(250, 247, 240, 0.22);
  border-radius: 2px;
  color: rgba(250, 247, 240, 0.8);
  padding: 8px 10px; cursor: pointer;
  display: flex; align-items: center;
  flex-shrink: 0;
}
.nav-search-mobile-btn:hover { background: rgba(250, 247, 240, 0.15); color: var(--paper); }

/* ---------- Burger + fullscreen overlay ---------- */
.nav-burger {
  display: none;
  width: 44px; height: 44px;
  position: relative;
  margin: -8px -8px -8px 0;
  padding: 0;
  flex-shrink: 0;
}
.nav-burger span {
  position: absolute;
  left: 10px; right: 10px;
  height: 1.5px;
  background: var(--paper);
  transition: transform 240ms ease, opacity 180ms ease, top 240ms ease;
}
.nav-burger span:nth-child(1) { top: 14px; }
.nav-burger span:nth-child(2) { top: 21px; }
.nav-burger span:nth-child(3) { top: 28px; }
.nav-burger.is-open span:nth-child(1) { top: 21px; transform: rotate(45deg); }
.nav-burger.is-open span:nth-child(2) { opacity: 0; }
.nav-burger.is-open span:nth-child(3) { top: 21px; transform: rotate(-45deg); }

.nav-overlay {
  position: fixed; inset: 0;
  background: var(--ink);
  color: var(--paper);
  z-index: 60;
  opacity: 0;
  pointer-events: none;
  transition: opacity 280ms ease;
  overflow-y: auto;
}
.nav-overlay.is-open { opacity: 1; pointer-events: auto; }
.nav-overlay-inner {
  min-height: 100%;
  padding: 0 var(--pad-x) 32px;
  display: flex; flex-direction: column; justify-content: space-between;
  gap: 48px;
}
/* Brand row mirrors the header top bar (same min-height/padding) so the logo
   and the divider above the first link sit exactly where the header logo and
   the search bar's top border sit on non-menu pages */
.nav-overlay-brand {
  display: flex; align-items: center; justify-content: center;
  min-height: 64px; padding: 12px 0 10px;
}
.nav-overlay-brand .brand { position: static; left: auto; top: auto; transform: none; }
.nav-overlay-links { list-style: none; margin: 0; padding: 0; }
.nav-overlay-links li {
  border-top: 1px solid rgba(250, 247, 240, 0.16);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 320ms ease, transform 320ms ease;
}
.nav-overlay-links li:last-child { border-bottom: 1px solid rgba(250, 247, 240, 0.16); }
.nav-overlay.is-open .nav-overlay-links li { opacity: 1; transform: translateY(0); }
.nav-overlay-link {
  display: flex; align-items: baseline; gap: 18px;
  width: 100%; text-align: left;
  padding: 20px 4px;
  color: rgba(250, 247, 240, 0.85);
  font-family: var(--serif);
}
.nav-overlay-link:hover, .nav-overlay-link.is-active { color: var(--paper); }
.nav-overlay-num {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.28em;
  color: rgba(250, 247, 240, 0.45);
  min-width: 36px;
}
.nav-overlay-label {
  font-size: clamp(36px, 9vw, 64px);
  line-height: 1.05;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.nav-overlay-link.is-active .nav-overlay-label { font-style: italic; }
.nav-overlay-foot {
  display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em;
  text-transform: uppercase; color: rgba(250, 247, 240, 0.5);
  padding-top: 24px;
  border-top: 1px solid rgba(250, 247, 240, 0.16);
}

/* ---------- Type primitives ---------- */
.eyebrow {
  font-family: var(--mono);
  font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase;
  color: var(--muted);
}
.kicker {
  font-family: var(--serif); font-style: italic; color: var(--muted);
  font-size: 16px;
}
a.kicker { text-decoration: none; }
a.kicker:hover { text-decoration: underline; }
.h-display {
  font-family: var(--serif);
  font-size: clamp(40px, 7vw, 92px);
  line-height: 0.95;
  letter-spacing: -0.012em;
  margin: 0;
  font-weight: 500;
}
.h-display em { font-style: italic; font-weight: 400; }
.h-section {
  font-family: var(--serif);
  font-size: clamp(28px, 3.4vw, 42px);
  line-height: 1.05;
  letter-spacing: -0.005em;
  margin: 0;
  font-weight: 500;
}
.h-card {
  font-family: var(--serif);
  font-size: 28px;
  line-height: 1.1;
  margin: 0;
  font-weight: 500;
}
.lede {
  font-family: var(--serif);
  font-size: 22px;
  line-height: 1.5;
  color: var(--ink-2);
  font-style: italic;
  max-width: 56ch;
}
.body p { font-size: 18px; line-height: 1.65; }
.body p + p { margin-top: 0.9em; }

/* Lightweight anti-copy deterrent: block selection of review body copy
   (nav, buttons and other UI keep normal selection) and stop image drag-save */
.body, .slider-cap {
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}
img {
  -webkit-user-drag: none;
  -khtml-user-drag: none;
  -moz-user-drag: none;
  user-drag: none;
  -webkit-touch-callout: none;
}

.numeral {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  color: var(--accent);
}

/* ---------- Rules ---------- */
.rule { height: 1px; background: var(--ink); border: 0; margin: 0; }
.rule-thin { height: 1px; background: var(--rule); border: 0; margin: 0; }
.rule-double { height: 5px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); margin: 0; }

/* ---------- Buttons / chips ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  border: 1px solid var(--ink); padding: 10px 18px;
  font-family: var(--serif); font-size: 14px;
  letter-spacing: 0.22em; text-transform: uppercase;
  background: transparent; color: var(--ink);
  transition: background 120ms ease, color 120ms ease;
}
.btn:hover { background: var(--ink); color: var(--paper); }
.btn--accent { border-color: var(--accent); color: var(--accent); }
.btn--accent:hover { background: var(--accent); color: var(--paper); }
.btn--ghost { border: 1px solid var(--ink); padding: 6px 14px; letter-spacing: 0.22em; }
.btn--ghost:hover { color: var(--accent); background: transparent; }
.btn--text { border: 0; padding: 6px 0; letter-spacing: 0.22em; text-decoration: none; }
.btn--text:hover { text-decoration: underline; color: var(--accent); background: transparent; }

.chip {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em;
  text-transform: uppercase; padding: 4px 10px;
  border: 1px solid var(--rule-strong); color: var(--ink-2);
}

/* ---------- Home ---------- */
.hero {
  display: grid; grid-template-columns: 1fr; gap: 28px;
  padding: 0;
}
.hero-meta {
  display: flex; justify-content: space-between; align-items: baseline; gap: 24px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.28em;
  text-transform: uppercase; color: var(--muted);
}
.hero-title { max-width: 18ch; }
.hero-sub {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 24px;
  padding-top: 8px;
}
.hero-sub .lede { margin: 0; }

.feature-grid {
  display: grid; grid-template-columns: 1.4fr 1fr; gap: 0;
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
}
.feature-grid > * { padding: 36px 0; }
.feature-main { padding-right: 40px; border-right: 1px solid var(--rule); }
.feature-side { padding-left: 40px; }
@media (max-width: 1200px) {
  .feature-grid { grid-template-columns: 1fr; }
  .feature-main { padding-right: 0; border-right: 0; border-bottom: 1px solid var(--rule); }
  .feature-side { padding-left: 0; }
  .feature-main p, .feature-side p { width: auto !important; max-width: 100% !important; }
}

.feature-photo {
  aspect-ratio: 4 / 3; width: 100%;
  border: 1px solid var(--rule);
  background: #ECE4D2;
  margin-bottom: 22px;
  overflow: hidden;
}
.feature-photo img { width: 100%; height: 100%; object-fit: cover; }

.scores {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
  border: 1px solid var(--rule);
}
.score-cell {
  padding: 14px 16px 14px 18px;
  border-right: 1px solid var(--rule);
}
.score-cell:first-child { padding-left: 18px; }
.score-cell:last-child { border-right: 0; padding-right: 16px; }
.score-label {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
}
.score-num {
  font-family: var(--serif);
  font-size: 30px; line-height: 1;
}
.score-num em { font-style: italic; color: var(--muted); font-size: 16px; margin-left: 2px; }

/* Categories block */
/* Categories block */
.cat-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 0;
  border: 1px solid var(--ink);
}
.cat-card {
  padding: 22px 24px;
  border-right: 1px solid var(--rule);
  text-align: center;
  display: grid;
  align-content: start;
  justify-items: center;
  cursor: pointer;
  background: transparent;
  position: relative;
}
.cat-card:last-child { border-right: 0; }
.cat-card:hover { background: var(--paper-2); }
.cat-card .numeral { font-size: 36px; }
.cat-card h3 { margin: 14px 0 6px; font-size: 24px; font-weight: 500; text-align: center; }
.cat-card p { margin: 0; color: var(--muted); font-style: italic; font-size: 15px; text-align: center; max-width: 26ch; }
.cat-card .cat-arrow { margin-top: 20px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.24em; }
@media (max-width: 880px) {
  .cat-grid { grid-template-columns: 1fr 1fr; }
  .cat-card { padding: 24px 16px; }
  .cat-card:nth-child(2n) { border-right: 0; }
  .cat-card:not(:last-child) { border-bottom: 1px solid var(--rule); }
  /* Odd final card spans the full row so it stays centred instead of sitting
     alone in the left column with an empty cell beside it */
  .cat-card:last-child:nth-child(odd) { grid-column: 1 / -1; border-right: 0; }
}

.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 56px 0 22px; gap: 24px;
}
.section-head--after-hero { padding: 36px 0 0; }
.section-head .title { display: flex; gap: 18px; align-items: baseline; }
.section-head .numeral:empty { display: none; }

/* ---------- About ---------- */
.about-grid {
  padding: 56px 0 64px;
}
.about-body { }
.about-body .first-letter::first-letter {
  font-family: var(--serif);
  font-size: 1em;
  font-style: normal;
  color: inherit;
  float: none;
  line-height: inherit;
  margin: 0;
  padding: 0;
  font-weight: inherit;
}

/* ---------- Categories ---------- */
.cat-page-head { padding: 56px 0 32px; }
.cat-list { padding-bottom: 64px; }
.cat-row {
  display: grid; grid-template-columns: 80px 1fr 1.4fr;
  gap: 32px;
  padding: 32px 0;
  border-top: 1px solid var(--rule);
}
.cat-row:last-child { border-bottom: 1px solid var(--rule); }
.cat-row .numeral { font-size: 56px; line-height: 1; }
.cat-row h3 { margin: 0 0 6px; font-size: 30px; font-weight: 500; }
.cat-row .meta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.cat-row .scale { display: grid; gap: 14px; }
.scale-row { display: grid; grid-template-columns: 70px 1fr; gap: 20px; align-items: baseline; }
.scale-row .mark { font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--accent); }
.scale-row p { margin: 0; }
@media (max-width: 880px) { .cat-row { grid-template-columns: 1fr; gap: 14px; } }

/* ---------- Reviews ---------- */
.reviews-head {
  display: grid; grid-template-columns: 1fr auto; gap: 24px;
  align-items: end;
  padding: 56px 0 0;
}
.reviews-hr { display: none; }
/* Empty placeholder elements inflate the grid row — suppress them */
.reviews-head span.eyebrow:empty,
.reviews-head p.kicker:empty { display: none; }
/* Match h1 bottom margin to About/Categories (inline style override) */
.reviews-head h1.h-display { margin-bottom: 20px !important; }
.filters {
  display: flex; flex-wrap: nowrap; align-items: flex-end; justify-content: space-between; gap: 18px 18px;
  padding: 16px var(--pad-x);
  margin: 0 calc(-1 * var(--pad-x));
  background: #F4F2EC;
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--rule);
}
.mob-filter-bar { display: none; }
.view-controls { display: flex; align-items: center; gap: 12px; justify-content: flex-end; padding-bottom: 16px; }
.mob-filter-btn { display: none; }
.filter-group { display: flex; flex-direction: column; gap: 6px; min-width: 100px; max-width: 150px; }
.filter-group label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.filter-group--tastiness { min-width: 175px; }
.filter-group select, .filter-group input {
  font-family: var(--serif); font-size: 16px;
  background: transparent; border: 0; border-bottom: 1px solid var(--rule-strong);
  padding: 4px 0; color: var(--ink); appearance: none;
}
.filter-group select:focus, .filter-group input:focus { outline: none; border-bottom-color: var(--accent); }
input[type="range"] { accent-color: var(--ink); }

.view-switch {
  display: inline-flex; border: 1px solid var(--ink);
}
.view-switch button {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em;
  text-transform: uppercase; padding: 8px 16px; color: var(--ink-2);
  border-right: 1px solid var(--ink);
}
.view-switch button:last-child { border-right: 0; }
.view-switch button.active { background: var(--ink); color: var(--paper); }
.filter-reset {
  font-family: var(--serif); font-size: 11px; letter-spacing: 0.22em;
  text-transform: uppercase; padding: 8px 16px;
  color: var(--ink); background: transparent;
  border: 1px solid var(--ink); cursor: pointer;
  align-self: flex-end; white-space: nowrap; flex-shrink: 0;
}
.filter-reset:hover { color: var(--accent); border-color: var(--accent); }

table.reviews-table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 4px; }
.reviews-table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.reviews-table th, table.reviews-table td {
  text-align: left; padding: 18px 14px; border-bottom: 1px solid var(--rule);
  vertical-align: baseline;
}
table.reviews-table th {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em;
  text-transform: uppercase; color: var(--muted); font-weight: 400;
  user-select: none;
}
table.reviews-table th .arrow { display: inline-block; width: 12px; color: var(--accent); }
table.reviews-table td { font-family: var(--serif); font-size: 18px; }
table.reviews-table td.name { font-size: 22px; }
table.reviews-table tr.row { cursor: pointer; transition: background 150ms ease; }
table.reviews-table tr.row:hover { background: rgba(0,0,0,0.03); }

.pagination {
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px 0 56px; gap: 24px;
}
.pag-btn {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.24em;
  text-transform: uppercase; color: var(--ink);
  background: transparent; border: 1px solid var(--ink);
  padding: 12px 20px; cursor: pointer;
  transition: background 120ms ease, color 120ms ease;
}
.pag-btn:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
.pag-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.pag-status {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.24em;
  text-transform: uppercase; color: var(--muted);
}
.tasti { font-variant-numeric: tabular-nums; }
.tasti em { font-style: italic; color: var(--muted); font-size: 0.7em; margin-left: 2px; }

/* Map view */
.map-wrap {
  position: relative;
  width: 100%;
  height: clamp(520px, 70vh, 720px);
  overflow: hidden;
}
.map-base {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.map-card {
  position: absolute; right: 20px; bottom: 20px;
  width: min(360px, 90%); padding: 22px;
  background: var(--paper); border: 1px solid var(--ink);
  box-shadow: 0 12px 30px rgba(31,27,22,0.18);
  z-index: 1000;
}
.map-card h4 { margin: 0 0 4px; font-size: 24px; font-weight: 500; }
.map-card .meta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.map-card .row { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--rule); font-size: 15px; }
.map-card .row:first-of-type { border-top: 0; }
.map-card-compact { display: none; }

/* Leaflet integration */
.leaflet-container {
  background: var(--paper-2) !important;
  font-family: var(--sans) !important;
}
.leaflet-container .leaflet-tile-pane { filter: saturate(0.85) contrast(0.97); }
.leaflet-container a { color: var(--ink-2); }
.leaflet-control-zoom a {
  color: var(--ink) !important;
  background: var(--paper) !important;
  border-color: var(--ink) !important;
}
.leaflet-control-attribution {
  background: rgba(250, 247, 240, 0.85) !important;
  color: var(--muted) !important;
  font-size: 11px;
}

/* Custom pin (rendered through L.divIcon) */
.cf-pin-icon { background: transparent; border: 0; overflow: visible; }
.cf-pin {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.cf-pin-svg path { fill: var(--ink); }
.cf-pin-svg .pin-ring { fill: white; }
.cf-pin-svg .pin-dot { fill: var(--ink); }
.cf-pin.active .cf-pin-svg path { fill: var(--accent); }
.cf-pin.active .cf-pin-svg .pin-dot { fill: var(--accent); }
.cf-pin .label {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.02em;
  padding: 2px 6px;
  background: var(--paper);
  border: 1px solid var(--rule);
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.15s;
  top: -22px;
  position: absolute;
  display: block;
  z-index: 1000;
}
.cf-pin:hover .label, .cf-pin.active .label { opacity: 1; }

.detail-head {
  padding: 48px 0 24px;
  border-bottom: 1px solid var(--ink);
}
.detail-meta {
  display: flex; gap: 24px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 18px;
}
.detail-action-row {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 14px 36px; margin-top: 32px;
}
/* Inline text links (phone / visit website) with animated hover underline */
.detail-link {
  display: inline-flex; align-items: center; gap: 10px;
  color: var(--ink); text-decoration: none;
}
.detail-link--phone .detail-link-label,
.detail-link--site .detail-link-label {
  font-family: var(--serif); font-size: 16px; letter-spacing: 0.16em;
  text-transform: uppercase;
}
.detail-link .detail-link-label { position: relative; }
.detail-link .detail-link-label::after {
  content: ""; position: absolute; left: 0; bottom: -2px;
  width: 100%; height: 1px; background: currentColor;
  transform: scaleX(0); transform-origin: left;
  transition: transform 240ms ease;
}
.detail-link:hover .detail-link-label::after { transform: scaleX(1); }
.detail-grid {
  display: grid; grid-template-columns: 2fr 1fr; gap: 56px;
  padding: 40px 0 80px;
}
@media (max-width: 880px) { .detail-grid { grid-template-columns: 1fr; gap: 32px; } }

.slider { position: relative; background: var(--paper-2); border: 1px solid var(--rule); width: 100%; aspect-ratio: 4 / 3; overflow: hidden; }
.slider-track {
  display: flex; height: 100%;
  transition: transform 480ms cubic-bezier(0.65, 0, 0.35, 1);
}
.slider-slide { flex: 0 0 100%; height: 100%; }
.slider-slide img { width: 100%; height: 100%; object-fit: cover; }
.slider-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px;
  background: none; border: 0;
  display: grid; place-items: center;
  color: var(--paper);
  filter: drop-shadow(0 1px 4px rgba(0,0,0,0.45));
}
.slider-arrow.prev { left: 16px; }
.slider-arrow.next { right: 16px; }
.slider-arrow:hover { color: #fff; transform: translateY(-50%) scale(1.12); }
.slider-meta {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 14px 0 0;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);
}
.slider-cap { font-family: var(--serif); font-style: normal; font-weight: 400; font-size: 13px; line-height: 1.45; color: var(--ink-2); padding: 4px 0 0; width: 500px; max-width: 100%; display: block; min-height: calc(13px * 1.45 * 2); overflow: hidden; }
.slider-dots { display: flex; gap: 8px; }
.slider-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rule-strong); cursor: pointer; }
.slider-dot.active { background: var(--ink); }

.review-toggle {
  display: flex; gap: 0; flex-wrap: wrap;
  border: 1px solid var(--ink);
  margin-bottom: 28px;
}
.review-toggle button {
  flex: 1; min-width: 130px;
  padding: 12px 16px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--ink-2);
  border-right: 1px solid var(--ink);
}
.review-toggle button:last-child { border-right: 0; }
.review-toggle button.active { background: var(--ink); color: var(--paper); }

.detail-side .info-table {
  border-top: 1px solid var(--ink); margin-top: 24px;
}
.detail-side .info-table .row {
  display: grid; grid-template-columns: auto 1fr; gap: 16px;
  padding: 14px 0; border-bottom: 1px solid var(--rule); align-items: center;
}
.detail-side .info-table .row .k {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em;
  text-transform: uppercase; color: var(--muted); white-space: nowrap;
  width: 140px;
}
.detail-side .info-table .row .v { font-size: 18px; }

.score-stack { display: grid; gap: 10px; margin-top: 20px; }
.score-line { display: grid; grid-template-columns: 130px 1fr 60px; gap: 16px; align-items: center; }
.score-line .k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); }
.score-line .bar { height: 1px; background: var(--rule); position: relative; }
.score-line .bar::after { content: ""; position: absolute; left: 0; top: -1px; height: 3px; background: var(--accent); width: var(--w, 50%); }
.score-line .v { font-family: var(--serif); font-size: 20px; text-align: right; font-variant-numeric: tabular-nums; }
.score-line .v em { font-style: italic; color: var(--muted); font-size: 14px; }

/* ---------- Footer ---------- */
.foot-wrap {
  margin-top: 60px;
  background: var(--ink);
  border-top: 1px solid var(--ink);
}
.foot {
  padding: 28px var(--pad-x);
  color: rgba(250, 247, 240, 0.7);
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em;
  text-transform: uppercase;
  display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap;
}

/* ---------- Density tweak ---------- */
[data-density="compact"] {
  font-size: 16px;
}
[data-density="compact"] .hero { padding: 36px 0 24px; }
[data-density="compact"] .section-head { padding: 36px 0 14px; }
[data-density="compact"] .feature-grid > * { padding: 24px 0; }
[data-density="compact"] table.reviews-table th,
[data-density="compact"] table.reviews-table td { padding: 12px 10px; }

/* ---------- Accent variants ---------- */
[data-accent="ink"]        { --accent: #161310; }
[data-accent="olive"]      { --accent: #4A5234; }
[data-accent="terracotta"] { --accent: #8E4429; }
[data-accent="burgundy"]   { --accent: #5A1A24; }

/* ---------- Alternating section bands ---------- */
.band-dark {
  background: var(--ink);
  color: var(--paper);
  margin: 56px calc(50% - 50vw) 0;
  padding: 56px calc(50vw - 50%) 64px;
  border-top: 1px solid var(--paper);
  border-bottom: 1px solid var(--paper);
}
.band-dark--hero {
  margin-top: 0;
  border-top: 0;
  padding-top: 48px;
  padding-bottom: 48px;
}
.band-dark .eyebrow,
.band-dark .kicker,
.band-dark .score-label,
.band-dark .meta { color: rgba(250, 247, 240, 0.65); }
.band-dark .h-section,
.band-dark .h-card { color: var(--paper); }
.band-dark .feature-grid {
  border-top: 1px solid rgba(250,247,240,0.4);
  border-bottom: 1px solid rgba(250,247,240,0.4);
}
.band-dark .feature-main { border-right-color: rgba(250,247,240,0.18); }
.band-dark .scores { border-color: rgba(250,247,240,0.4); }
.band-dark .score-cell { border-right-color: rgba(250,247,240,0.18); }
.band-dark .feature-photo { border-color: rgba(250,247,240,0.2); background: #2C2823; }
.band-dark .btn { border-color: var(--paper); color: var(--paper); }
.band-dark .btn:hover { background: var(--paper); color: var(--ink); }
.band-dark .btn--ghost { border-color: var(--paper); }
.band-dark .btn--ghost:hover { color: var(--paper); background: transparent; opacity: 0.7; }
.band-dark .btn--text { border: 0; }
.band-dark .btn--text:hover { color: var(--paper); background: transparent; opacity: 0.7; text-decoration: underline; }
.band-dark a.link { border-color: rgba(250,247,240,0.5); }
.band-dark .section-head { padding-top: 0; }

.band-dark .cat-grid { border-color: rgba(250,247,240,0.4); }
.band-dark .cat-card { border-right-color: rgba(250,247,240,0.18); color: var(--paper); }
.band-dark .cat-card:hover { background: rgba(250,247,240,0.04); }
.band-dark .cat-card p { color: rgba(250,247,240,0.7); }
.band-dark .cat-card .numeral { color: var(--paper); }
.band-dark .numeral { color: var(--paper); }

/* ---------- Mini map (review detail) ---------- */
.mini-map {
  position: relative;
  margin-top: 28px;
  height: 220px;
  border: 1px solid var(--ink);
  background: #ECE6D4;
  background-image:
    linear-gradient(to right, rgba(22,19,16,0.06) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(22,19,16,0.06) 1px, transparent 1px),
    radial-gradient(circle at 30% 40%, rgba(122,148,124,0.30), transparent 35%),
    radial-gradient(circle at 75% 65%, rgba(178,168,140,0.28), transparent 40%);
  background-size: 36px 36px, 36px 36px, auto, auto;
  overflow: hidden;
}
.mini-map .river {
  position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(118deg, transparent 42%, rgba(122,148,170,0.55) 42%, rgba(122,148,170,0.55) 45%, transparent 45%);
}
.mini-map .pin {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -100%);
}
.mini-map .pin .stick {
  width: 22px; height: 28px;
  border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
  background: var(--ink); border: 1px solid var(--ink);
  box-shadow: 0 4px 8px rgba(22,19,16,0.25);
  position: relative;
}
.mini-map .pin .stick::after {
  content: ""; position: absolute; inset: 6px; border-radius: 50%;
  background: var(--paper);
}
.mini-map .addr {
  position: absolute; left: 16px; bottom: 14px;
  background: var(--paper); border: 1px solid var(--ink);
  padding: 8px 12px;
  font-family: var(--serif); font-size: 15px;
  max-width: 75%;
}
.mini-map .addr .city {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 2px;
}
.mini-map iframe { width: 100%; height: 100%; border: 0; display: block; }



/* ============================================================
   RESPONSIVE — mobile + tablet
   ============================================================ */

/* Hide desktop nav bars / show burger + mobile search on tablet & below */
@media (max-width: 880px) {
  .nav-links { display: none; }
  .nav-search-wrap { display: none; }
  .nav-search-mobile-bar { display: flex; }
  .nav-burger { display: block; }
  .brand-logo { height: 44px; }
  .nav-top-bar { display: flex; justify-content: space-between; padding: 12px 0 10px; gap: 12px; }
  .nav { padding-bottom: 0; }
}

/* ---------- Tablet breakpoint (≤880px) ---------- */
@media (max-width: 880px) {
  :root { --pad-x: clamp(16px, 4vw, 28px); }
  body { font-size: 17px; }

  /* Hero */
  .hero { padding: 36px 0 12px; gap: 20px; }
  .hero-meta { flex-wrap: wrap; gap: 8px 18px; font-size: 10px; letter-spacing: 0.22em; }
  .hero-sub { grid-template-columns: 1fr; gap: 18px; }
  .lede { font-size: 19px; }

  /* Section heads stack */
  .section-head { padding: 40px 0 14px; }
  .section-head--after-hero { padding: 0; }

  /* Scores: 4-up → 2x2 */
  .scores { grid-template-columns: 1fr 1fr; }
  .score-cell { border-bottom: 1px solid var(--rule); }
  .score-cell:nth-child(2n) { border-right: 0; }
  .score-cell:nth-last-child(-n+2) { border-bottom: 0; }
  .score-num { font-size: 26px; }

  /* About */
  .about-grid { padding: 36px 0 40px; }
  .lede { font-size: 19px; }

  /* Categories */
  .cat-page-head { padding: 36px 0 24px; }

  /* Categories detail rows */
  .cat-row { padding: 24px 0; }
  .cat-row .numeral { font-size: 44px; }
  .cat-row h3 { font-size: 24px; }
  .scale-row { grid-template-columns: 56px 1fr; gap: 14px; }

  /* Reviews head */
  .reviews-head { padding: 36px 0 16px; }
  .filters { gap: 14px 22px; padding: 14px 0; }

  /* Reviews table → make horizontally scrollable container */
  .reviews-table-wrap {
    margin: 0 calc(-1 * var(--pad-x));
    padding: 0 var(--pad-x);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  table.reviews-table { min-width: 720px; }
  table.reviews-table th, table.reviews-table td { padding: 14px 10px; }
  table.reviews-table td.name { font-size: 19px; }

  /* Map view */
  .map-wrap { height: clamp(420px, 60vh, 600px); }
  .map-card { right: 12px; left: 12px; bottom: 12px; width: auto; padding: 12px 14px; }
  .map-key { left: 12px; top: 12px; padding: 8px 10px; font-size: 9px; }

  /* Compact map card (mobile): show condensed layout, hide the full one */
  .map-card-full { display: none; }
  .map-card-compact { display: block; }
  .map-card-compact h4 { margin: 0; font-size: 18px; line-height: 1.15; font-weight: 500; }
  .map-card-compact .mcc-sub {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--muted); margin-top: 4px;
  }
  .map-card-compact .mcc-stats {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px;
    font-size: 13px; margin-top: 8px;
  }
  .map-card-compact .mcc-sep { color: var(--rule-strong); }
  .map-card-compact .btn { margin-top: 10px; padding: 7px 14px; font-size: 11px; }

  /* Pagination */
  .pagination { padding: 18px 0 40px; }
  .pag-btn { padding: 10px 16px; font-size: 10px; }

  /* Detail page */
  .detail-head { padding: 32px 0 18px; }
  .detail-meta { gap: 14px; font-size: 10px; }
  .detail-grid { padding: 28px 0 56px; gap: 28px; }
  /* Address on its own row; phone + website as icon-only links on the next
     row (labels hidden, tel:/website behaviour unchanged) */
  .detail-action-row { flex-wrap: wrap; align-items: center; gap: 14px 28px; }
  .detail-action-row .kicker { width: 100%; }
  .detail-link .detail-link-label { display: none; }
  .detail-link svg { width: 20px; height: 20px; }
  .detail-side .info-table .row { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 12px 0; }
  .detail-side .info-table .row .k { width: 140px; }
  .detail-side .info-table .row .v { font-size: 16px; }
  .score-line { grid-template-columns: 110px 1fr 50px; gap: 12px; }

  /* Review-toggle: stack tabs */
  .review-toggle button { padding: 10px 12px; font-size: 10px; min-width: 110px; }

  /* Slider arrows: smaller on mobile */
  .slider-arrow { width: 36px; height: 36px; font-size: 18px; }
  .slider-arrow.prev { left: 8px; }
  .slider-arrow.next { right: 8px; }

  /* Footer */
  .foot { flex-direction: column; gap: 8px; align-items: flex-start; padding: 22px var(--pad-x); font-size: 10px; }

  /* Bands: tighten padding */
  .band-dark { padding: 36px calc(50vw - 50%) 44px; margin-top: 36px; }
  .band-dark--hero { padding-top: 4px; padding-bottom: 20px; margin-top: 0; }
}


/* Recent list rows */
.recent-row { display: grid; grid-template-columns: 160px 1fr 1fr auto; gap: 32px; padding: 22px 16px; cursor: pointer; align-items: baseline; position: relative; }
.recent-row-preview { color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- Row hover CTA ---------- */
.row-hover-cta {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.48);
  font-family: var(--serif);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--paper);
  opacity: 0;
  transition: opacity 220ms ease;
  pointer-events: none;
}
.recent-row:hover .row-hover-cta { opacity: 1; text-decoration: underline; }

/* Table row overlay (desktop) */
table.reviews-table tr.row { position: relative; }
table.reviews-table tr.row::after {
  content: "READ THIS REVIEW →";
  position: absolute;
  top: 1px; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.48);
  font-family: var(--serif);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--paper);
  opacity: 0;
  transition: opacity 220ms ease;
  pointer-events: none;
}
table.reviews-table tr.row:hover::after { opacity: 1; }

/* ---------- Tablet breakpoint (≤768px) ---------- */
@media (max-width: 768px) {
  /* Nav: centre logo, keep hamburger right */
  .nav-top-bar { position: relative; justify-content: flex-end; min-height: 64px; }
  .brand { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .brand-logo { height: 40px; max-width: none; }

  .hero { padding: 32px 0 24px; }
  .h-display { font-size: clamp(36px, 8vw, 64px) !important; }
  .lede { font-size: 18px; }
  .feature-grid > * { padding: 28px 0; }
  .scores { grid-template-columns: 1fr 1fr; }
  .score-cell { border-bottom: 1px solid var(--rule); }
  .score-cell:nth-child(2n) { border-right: 0; }
  .score-cell:nth-last-child(-n+2) { border-bottom: 0; }
  .cat-grid { grid-template-columns: 1fr 1fr; }
  .cat-row { grid-template-columns: 1fr; gap: 14px; }
  .detail-grid { grid-template-columns: 1fr; gap: 32px; }
  .reviews-head { display: block; }
  .reviews-hr { display: block; }
  .view-controls { padding: 10px 0 16px; }
  .reviews-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-left: calc(-1 * var(--pad-x)); margin-right: calc(-1 * var(--pad-x)); padding-left: 0; padding-right: var(--pad-x); width: calc(100% + 2 * var(--pad-x)); box-sizing: border-box; }
  table.reviews-table { min-width: 540px; }
  .map-wrap { height: clamp(420px, 60vh, 600px); }
  /* Recent list: collapse to single column at tablet */
  .recent-row { grid-template-columns: 1fr; gap: 6px; padding: 18px 0; }

  /* Override inline width styles on feature card paragraphs so they don't
     stretch the grid item wider than the viewport, which would inflate the photo */
  .feature-main p, .feature-side p { width: auto !important; max-width: 100% !important; }

  /* Scores: ensure 2×2 and compact */
  .scores { grid-template-columns: 1fr 1fr; }
  .score-num { font-size: 26px; }

  /* Section-head: stack on mobile */
  .section-head { flex-direction: column; align-items: flex-start; gap: 14px; padding: 36px 0 14px; }
  .section-head--after-hero { padding: 0; }
  .feature-grid > * { padding: 16px 0; }
  /* Row hover CTA: always visible on mobile */

/* ---------- Phone breakpoint (≤560px) ---------- */

}

  <script>
    /* Basic anti-copy deterrent (not DRM). Block right-click on images and
       review body text, and prevent image drag-to-save. Links, buttons and
       scrolling/tapping stay fully functional. */
    (function () {
      document.addEventListener("contextmenu", function (e) {
        if (e.target.closest("img, .body, .slider-cap")) e.preventDefault();
      });
      document.addEventListener("dragstart", function (e) {
        if (e.target.tagName === "IMG") e.preventDefault();
      });
