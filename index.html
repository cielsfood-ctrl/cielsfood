  --paper: #FAF7F0;

  --accent: #161310; /* default: black ink, restrained */
  --accent-soft: rgba(22, 19, 16, 0.06);
  --serif: "EB Garamond", "Garamond", "Times New Roman", Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --pad-x: clamp(20px, 4vw, 56px);
  --max-w: 1280px;
}

[data-paper="on"] body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(rgba(31,27,22,0.025) 1px, transparent 1px),
    radial-gradient(rgba(31,27,22,0.018) 1px, transparent 1px);
  background-size: 3px 3px, 7px 7px;
  background-position: 0 0, 1.5px 1.5px;
  mix-blend-mode: multiply;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--serif);
  font-size: 18px;
  line-height: 1.55;
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: inherit; text-decoration: none; }
a.link { border-bottom: 1px solid var(--rule-strong); padding-bottom: 1px; }
a.link:hover { color: var(--accent); border-color: var(--accent); }

button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

img { max-width: 100%; display: block; }

.shell {
  position: relative;
  z-index: 1;
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 var(--pad-x);
}

/* ---------- Nav (dark) ---------- */
.nav {
  border-bottom: 1px solid var(--ink);
  background: var(--ink);
  color: var(--paper);
  position: sticky; top: 0; z-index: 50;
}
.nav-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 0 16px;
  gap: 24px;
}
.brand {
  display: flex; align-items: center; gap: 14px;
  cursor: pointer;
}
.brand-logo {
  height: 56px; width: auto; display: block;
  filter: invert(1) brightness(1.1);
}

.nav-links {
  display: flex; align-items: center; gap: 0;
}
.nav-link {
  font-family: var(--serif);
  font-size: 14px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  padding: 10px 18px;
  color: rgba(250, 247, 240, 0.7);
  position: relative;
}
.nav-link[aria-current="page"] { color: var(--paper); }
.nav-link[aria-current="page"]::after {
  content: ""; position: absolute; left: 18px; right: 18px; bottom: 2px; height: 1px; background: var(--paper);
}
.nav-link:hover { color: var(--paper); }

.nav-thin {
  border-top: 1px solid rgba(250, 247, 240, 0.18);
  padding: 8px 0;
  color: rgba(250, 247, 240, 0.55);
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em;
  text-transform: uppercase;
}

/* ---------- Burger + fullscreen overlay ---------- */
.nav-burger {
  display: none;
  width: 44px; height: 44px;
  position: relative;
  margin: -8px -8px -8px 0;
  padding: 0;
  flex-shrink: 0;
}
.nav-burger span {
  position: absolute;
  left: 10px; right: 10px;
  height: 1.5px;
  background: var(--paper);
  transition: transform 240ms ease, opacity 180ms ease, top 240ms ease;
}
.nav-burger span:nth-child(1) { top: 14px; }
.nav-burger span:nth-child(2) { top: 21px; }
.nav-burger span:nth-child(3) { top: 28px; }
.nav-burger.is-open span:nth-child(1) { top: 21px; transform: rotate(45deg); }
.nav-burger.is-open span:nth-child(2) { opacity: 0; }
.nav-burger.is-open span:nth-child(3) { top: 21px; transform: rotate(-45deg); }

.nav-overlay {
  position: fixed; inset: 0;
  background: var(--ink);
  color: var(--paper);
  z-index: 60;
  opacity: 0;
  pointer-events: none;
  transition: opacity 280ms ease;
  overflow-y: auto;
}
.nav-overlay.is-open { opacity: 1; pointer-events: auto; }
.nav-overlay-inner {
  min-height: 100%;
  padding: 90px var(--pad-x) 32px;
  display: flex; flex-direction: column; justify-content: space-between;
  gap: 48px;
}
.nav-overlay-links { list-style: none; margin: 0; padding: 0; }
.nav-overlay-links li {
  border-top: 1px solid rgba(250, 247, 240, 0.16);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 320ms ease, transform 320ms ease;
}
.nav-overlay-links li:last-child { border-bottom: 1px solid rgba(250, 247, 240, 0.16); }
.nav-overlay.is-open .nav-overlay-links li { opacity: 1; transform: translateY(0); }
.nav-overlay-link {
  display: flex; align-items: baseline; gap: 18px;
  width: 100%; text-align: left;
  padding: 20px 4px;
  color: rgba(250, 247, 240, 0.85);
  font-family: var(--serif);
}
.nav-overlay-link:hover, .nav-overlay-link.is-active { color: var(--paper); }
.nav-overlay-num {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.28em;
  color: rgba(250, 247, 240, 0.45);
  min-width: 36px;
}
.nav-overlay-label {
  font-size: clamp(36px, 9vw, 64px);
  line-height: 1.05;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.nav-overlay-link.is-active .nav-overlay-label { font-style: italic; }
.nav-overlay-foot {
  display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em;
  text-transform: uppercase; color: rgba(250, 247, 240, 0.5);
  padding-top: 24px;
  border-top: 1px solid rgba(250, 247, 240, 0.16);
}

/* ---------- Type primitives ---------- */
.eyebrow {
  font-family: var(--mono);
  font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase;
  color: var(--muted);
}
.kicker {
  font-family: var(--serif); font-style: italic; color: var(--muted);
  font-size: 16px;
}
.h-display {
  font-family: var(--serif);
  font-size: clamp(40px, 7vw, 92px);
  line-height: 0.95;
  letter-spacing: -0.012em;
  margin: 0;
  font-weight: 500;
}
.h-display em { font-style: italic; font-weight: 400; }
.h-section {
  font-family: var(--serif);
  font-size: clamp(28px, 3.4vw, 42px);
  line-height: 1.05;
  letter-spacing: -0.005em;
  margin: 0;
  font-weight: 500;
}
.h-card {
  font-family: var(--serif);
  font-size: 28px;
  line-height: 1.1;
  margin: 0;
  font-weight: 500;
}
.lede {
  font-family: var(--serif);
  font-size: 22px;
  line-height: 1.5;
  color: var(--ink-2);
  font-style: italic;
  max-width: 56ch;
}
.body p { font-size: 18px; line-height: 1.65; }
.body p + p { margin-top: 0.9em; }

.numeral {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  color: var(--accent);
}

/* ---------- Rules ---------- */
.rule { height: 1px; background: var(--ink); border: 0; margin: 0; }
.rule-thin { height: 1px; background: var(--rule); border: 0; margin: 0; }
.rule-double { height: 5px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); margin: 0; }

/* ---------- Buttons / chips ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  border: 1px solid var(--ink); padding: 10px 18px;
  font-family: var(--serif); font-size: 14px;
  letter-spacing: 0.22em; text-transform: uppercase;
  background: transparent; color: var(--ink);
  transition: background 120ms ease, color 120ms ease;
}
.btn:hover { background: var(--ink); color: var(--paper); }
.btn--accent { border-color: var(--accent); color: var(--accent); }
.btn--accent:hover { background: var(--accent); color: var(--paper); }
.btn--ghost { border: 0; padding: 6px 0; letter-spacing: 0.22em; }
.btn--ghost:hover { color: var(--accent); background: transparent; }

.chip {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em;
  text-transform: uppercase; padding: 4px 10px;
  border: 1px solid var(--rule-strong); color: var(--ink-2);
}

/* ---------- Home ---------- */
.hero {
  display: grid; grid-template-columns: 1fr; gap: 28px;
  padding: 56px 0 40px;
}
.hero-meta {
  display: flex; justify-content: space-between; align-items: baseline; gap: 24px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.28em;
  text-transform: uppercase; color: var(--muted);
}
.hero-title { max-width: 18ch; }
.hero-sub {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 24px;
  padding-top: 8px;
}
.hero-sub .lede { margin: 0; }

.feature-grid {
  display: grid; grid-template-columns: 1.4fr 1fr; gap: 0;
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
}
.feature-grid > * { padding: 36px 0; }
.feature-main { padding-right: 40px; border-right: 1px solid var(--rule); }
.feature-side { padding-left: 40px; }
@media (max-width: 880px) {
  .feature-grid { grid-template-columns: 1fr; }
  .feature-main { padding-right: 0; border-right: 0; border-bottom: 1px solid var(--rule); }
  .feature-side { padding-left: 0; }
}

.feature-photo {
  aspect-ratio: 4 / 3; width: 100%;
  border: 1px solid var(--rule);
  background: #ECE4D2;
  margin-bottom: 22px;
}
.feature-photo img { width: 100%; height: 100%; object-fit: cover; }

.scores {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
  border: 1px solid var(--rule);
}
.score-cell {
  padding: 14px 16px 14px 18px;
  border-right: 1px solid var(--rule);
}
.score-cell:first-child { padding-left: 18px; }
.score-cell:last-child { border-right: 0; padding-right: 16px; }
.score-label {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
}
.score-num {
  font-family: var(--serif);
  font-size: 30px; line-height: 1;
}
.score-num em { font-style: italic; color: var(--muted); font-size: 16px; margin-left: 2px; }

/* Categories block */
/* Categories block */
.cat-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 0;
  border: 1px solid var(--ink);
}
.cat-card {
  padding: 30px 24px;
  border-right: 1px solid var(--rule);
  text-align: center;
  display: grid;
  align-content: start;
  justify-items: center;
  cursor: pointer;
  background: transparent;
  position: relative;
}
.cat-card:last-child { border-right: 0; }
.cat-card:hover { background: var(--paper-2); }
.cat-card .numeral { font-size: 36px; }
.cat-card h3 { margin: 14px 0 6px; font-size: 24px; font-weight: 500; text-align: center; }
.cat-card p { margin: 0; color: var(--muted); font-style: italic; font-size: 15px; text-align: center; max-width: 26ch; }
.cat-card .cat-arrow { margin-top: 20px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.24em; }
@media (max-width: 880px) {
  .cat-grid { grid-template-columns: 1fr 1fr; }
  .cat-card { padding: 24px 16px; }
  .cat-card:nth-child(2n) { border-right: 0; }
  .cat-card:not(:nth-last-child(-n+2)) { border-bottom: 1px solid var(--rule); }
}

.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 56px 0 18px; gap: 24px;
}
.section-head .title { display: flex; gap: 18px; align-items: baseline; }

/* ---------- About ---------- */
.about-grid {
  display: grid; grid-template-columns: 0.85fr 1.4fr; gap: 56px;
  padding: 56px 0 64px;
}
.portrait {
  aspect-ratio: 3 / 4; width: 100%;
  background: #E6DEC8; border: 1px solid var(--rule);
}
.about-cap {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--muted);
  margin-top: 10px;
}
.about-body { max-width: 64ch; }
.about-body .first-letter::first-letter {
  font-family: var(--serif);
  font-size: 1em;
  font-style: normal;
  color: inherit;
  float: none;
  line-height: inherit;
  margin: 0;
  padding: 0;
  font-weight: inherit;
}
@media (max-width: 880px) { .about-grid { grid-template-columns: 1fr; gap: 32px; } }

/* ---------- Categories ---------- */
.cat-page-head { padding: 56px 0 32px; max-width: 64ch; }
.cat-list { padding-bottom: 64px; }
.cat-row {
  display: grid; grid-template-columns: 80px 1fr 1.4fr;
  gap: 32px;
  padding: 32px 0;
  border-top: 1px solid var(--rule);
}
.cat-row:last-child { border-bottom: 1px solid var(--rule); }
.cat-row .numeral { font-size: 56px; line-height: 1; }
.cat-row h3 { margin: 0 0 6px; font-size: 30px; font-weight: 500; }
.cat-row .meta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.cat-row .scale { display: grid; gap: 14px; }
.scale-row { display: grid; grid-template-columns: 70px 1fr; gap: 20px; align-items: baseline; }
.scale-row .mark { font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--accent); }
.scale-row p { margin: 0; }
@media (max-width: 880px) { .cat-row { grid-template-columns: 1fr; gap: 14px; } }

/* ---------- Reviews ---------- */
.reviews-head {
  display: grid; grid-template-columns: 1fr auto; gap: 24px;
  align-items: end;
  padding: 56px 0 24px;
}
.filters {
  display: flex; flex-wrap: wrap; gap: 18px 28px;
  padding: 16px 0;
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--rule);
}
.filter-group { display: flex; flex-direction: column; gap: 6px; min-width: 130px; }
.filter-group label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); }
.filter-group select, .filter-group input {
  font-family: var(--serif); font-size: 16px;
  background: transparent; border: 0; border-bottom: 1px solid var(--rule-strong);
  padding: 4px 0; color: var(--ink); appearance: none;
}
.filter-group select:focus, .filter-group input:focus { outline: none; border-bottom-color: var(--accent); }

.view-switch {
  display: inline-flex; border: 1px solid var(--ink);
}
.view-switch button {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em;
  text-transform: uppercase; padding: 8px 16px; color: var(--ink-2);
  border-right: 1px solid var(--ink);
}
.view-switch button:last-child { border-right: 0; }
.view-switch button.active { background: var(--ink); color: var(--paper); }

table.reviews-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
table.reviews-table th, table.reviews-table td {
  text-align: left; padding: 18px 14px; border-bottom: 1px solid var(--rule);
  vertical-align: baseline;
}
table.reviews-table th {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em;
  text-transform: uppercase; color: var(--muted); font-weight: 400;
  user-select: none;
}
table.reviews-table th .arrow { display: inline-block; width: 12px; color: var(--accent); }
table.reviews-table td { font-size: 18px; }
table.reviews-table td.name { font-size: 22px; }
table.reviews-table tr.row { cursor: pointer; transition: background 120ms ease; }
table.reviews-table tr.row:hover { background: var(--paper-2); }

.pagination {
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px 0 56px; gap: 24px;
}
.pag-btn {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.24em;
  text-transform: uppercase; color: var(--ink);
  background: transparent; border: 1px solid var(--ink);
  padding: 12px 20px; cursor: pointer;
  transition: background 120ms ease, color 120ms ease;
}
.pag-btn:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
.pag-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.pag-status {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.24em;
  text-transform: uppercase; color: var(--muted);
}
.tasti { font-variant-numeric: tabular-nums; }
.tasti em { font-style: italic; color: var(--muted); font-size: 0.7em; margin-left: 2px; }

/* Map view */
.map-wrap {
  position: relative;
  border: 1px solid var(--ink);
  background: var(--paper-2);
  height: clamp(500px, 70vh, 760px);
  overflow: hidden;
  margin-top: 18px;
}
.map-canvas {
  position: absolute; inset: 0;
  background-color: #E8E1CF;
  background-image:
    linear-gradient(to right, rgba(31,27,22,0.06) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(31,27,22,0.06) 1px, transparent 1px),
    radial-gradient(circle at 20% 30%, rgba(122,148,124,0.30), transparent 30%),
    radial-gradient(circle at 78% 60%, rgba(122,148,124,0.22), transparent 35%),
    radial-gradient(circle at 50% 75%, rgba(178,168,140,0.30), transparent 40%);
  background-size: 80px 80px, 80px 80px, auto, auto, auto;
}
.map-rivers {
  position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(120deg, transparent 38%, rgba(122,148,170,0.55) 38%, rgba(122,148,170,0.55) 41%, transparent 41%),
    linear-gradient(60deg,  transparent 62%, rgba(122,148,170,0.45) 62%, rgba(122,148,170,0.45) 64%, transparent 64%);
}
.map-pin {
  position: absolute; transform: translate(-50%, -100%);
  cursor: pointer;
}
.map-pin .stick {
  width: 22px; height: 28px;
  border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
  background: var(--accent); border: 1px solid #3A0E15;
  box-shadow: 0 4px 8px rgba(31,27,22,0.25);
  position: relative;
}
.map-pin .stick::after {
  content: ""; position: absolute; inset: 6px; border-radius: 50%;
  background: var(--paper);
}
.map-pin .label {
  position: absolute; left: 50%; transform: translateX(-50%);
  top: 4px;
  background: var(--paper); border: 1px solid var(--ink);
  font-family: var(--serif); font-size: 14px;
  padding: 4px 10px; white-space: nowrap;
  opacity: 0; pointer-events: none;
  transition: opacity 120ms ease;
}
.map-pin:hover .label, .map-pin.active .label { opacity: 1; }
.map-pin.active .stick { background: var(--ink); border-color: var(--ink); }

.map-card {
  position: absolute; right: 20px; bottom: 20px;
  width: min(360px, 90%); padding: 22px;
  background: var(--paper); border: 1px solid var(--ink);
  box-shadow: 0 12px 30px rgba(31,27,22,0.18);
}
.map-card h4 { margin: 0 0 4px; font-size: 24px; font-weight: 500; }
.map-card .meta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.map-card .row { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--rule); font-size: 15px; }
.map-card .row:first-of-type { border-top: 0; }

.map-key {
  position: absolute; left: 16px; top: 16px;
  background: var(--paper); border: 1px solid var(--ink);
  padding: 10px 14px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
}

/* ---------- Review detail ---------- */
.detail-head {
  padding: 48px 0 24px;
  border-bottom: 1px solid var(--ink);
}
.detail-meta {
  display: flex; gap: 24px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 18px;
}
.detail-grid {
  display: grid; grid-template-columns: 1.3fr 1fr; gap: 56px;
  padding: 40px 0 80px;
}
@media (max-width: 880px) { .detail-grid { grid-template-columns: 1fr; gap: 32px; } }

.slider { position: relative; background: var(--paper-2); border: 1px solid var(--rule); width: 626px; height: 469px; max-width: 100%; aspect-ratio: 4 / 3; overflow: hidden; }
.slider-track {
  display: flex; height: 100%;
  transition: transform 480ms cubic-bezier(0.65, 0, 0.35, 1);
}
.slider-slide { flex: 0 0 100%; height: 100%; }
.slider-slide img { width: 100%; height: 100%; object-fit: cover; }
.slider-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px;
  background: var(--paper); border: 1px solid var(--ink);
  display: grid; place-items: center;
  font-family: var(--serif); font-size: 22px;
}
.slider-arrow.prev { left: 16px; }
.slider-arrow.next { right: 16px; }
.slider-arrow:hover { background: var(--ink); color: var(--paper); }
.slider-meta {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 14px 0 0;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);
}
.slider-cap { font-family: var(--serif); font-style: normal; font-weight: 400; font-size: 13px; color: var(--ink-2); padding: 4px 0 0; width: 500px; max-width: 100%; display: block; }
.slider-dots { display: flex; gap: 8px; }
.slider-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rule-strong); cursor: pointer; }
.slider-dot.active { background: var(--ink); }

.review-toggle {
  display: flex; gap: 0; flex-wrap: wrap;
  border: 1px solid var(--ink);
  margin-bottom: 28px;
}
.review-toggle button {
  flex: 1; min-width: 130px;
  padding: 12px 16px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--ink-2);
  border-right: 1px solid var(--ink);
}
.review-toggle button:last-child { border-right: 0; }
.review-toggle button.active { background: var(--ink); color: var(--paper); }

.detail-side .info-table {
  border-top: 1px solid var(--ink); margin-top: 24px;
}
.detail-side .info-table .row {
  display: grid; grid-template-columns: 130px 1fr; gap: 16px;
  padding: 14px 0; border-bottom: 1px solid var(--rule);
}
.detail-side .info-table .row .k {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em;
  text-transform: uppercase; color: var(--muted); padding-top: 4px;
}
.detail-side .info-table .row .v { font-size: 18px; }

.score-stack { display: grid; gap: 10px; margin-top: 20px; }
.score-line { display: grid; grid-template-columns: 130px 1fr 60px; gap: 16px; align-items: center; }
.score-line .k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); }
.score-line .bar { height: 1px; background: var(--rule); position: relative; }
.score-line .bar::after { content: ""; position: absolute; left: 0; top: -1px; height: 3px; background: var(--accent); width: var(--w, 50%); }
.score-line .v { font-family: var(--serif); font-size: 20px; text-align: right; font-variant-numeric: tabular-nums; }
.score-line .v em { font-style: italic; color: var(--muted); font-size: 14px; }

/* ---------- Footer ---------- */
.foot-wrap {
  margin-top: 60px;
  background: var(--ink);
  border-top: 1px solid var(--ink);
  /* break out of any containing .shell so the dark band is full-bleed like .nav */
  width: 100vw;
  position: relative;
  left: 50%;
  right: 50%;
  margin-left: -50vw;
  margin-right: -50vw;
}
.foot {
  padding: 28px 0;
  color: rgba(250, 247, 240, 0.7);
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em;
  text-transform: uppercase;
  display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap;
}

/* ---------- Density tweak ---------- */
[data-density="compact"] {
  font-size: 16px;
}
[data-density="compact"] .hero { padding: 36px 0 24px; }
[data-density="compact"] .section-head { padding: 36px 0 14px; }
[data-density="compact"] .feature-grid > * { padding: 24px 0; }
[data-density="compact"] table.reviews-table th,
[data-density="compact"] table.reviews-table td { padding: 12px 10px; }

/* ---------- Accent variants ---------- */
[data-accent="ink"]        { --accent: #161310; }
[data-accent="olive"]      { --accent: #4A5234; }
[data-accent="terracotta"] { --accent: #8E4429; }
[data-accent="burgundy"]   { --accent: #5A1A24; }

/* ---------- Alternating section bands ---------- */
.band-dark {
  background: var(--ink);
  color: var(--paper);
  margin: 56px calc(50% - 50vw) 0;
  padding: 56px calc(50vw - 50%) 64px;
  border-top: 1px solid var(--paper);
  border-bottom: 1px solid var(--paper);
}
.band-dark--hero {
  margin-top: 0;
  border-top: 0;
  padding-top: 8px;
}
.band-dark .eyebrow,
.band-dark .kicker,
.band-dark .score-label,
.band-dark .meta { color: rgba(250, 247, 240, 0.65); }
.band-dark .h-section,
.band-dark .h-card { color: var(--paper); }
.band-dark .feature-grid {
  border-top: 1px solid rgba(250,247,240,0.4);
  border-bottom: 1px solid rgba(250,247,240,0.4);
}
.band-dark .feature-main { border-right-color: rgba(250,247,240,0.18); }
.band-dark .scores { border-color: rgba(250,247,240,0.4); }
.band-dark .score-cell { border-right-color: rgba(250,247,240,0.18); }
.band-dark .feature-photo { border-color: rgba(250,247,240,0.2); background: #2C2823; }
.band-dark .btn { border-color: var(--paper); color: var(--paper); }
.band-dark .btn:hover { background: var(--paper); color: var(--ink); }
.band-dark .btn--ghost { border: 0; }
.band-dark .btn--ghost:hover { color: var(--paper); background: transparent; opacity: 0.7; }
.band-dark a.link { border-color: rgba(250,247,240,0.5); }
.band-dark .section-head { padding-top: 0; }

.band-dark .cat-grid { border-color: rgba(250,247,240,0.4); }
.band-dark .cat-card { border-right-color: rgba(250,247,240,0.18); color: var(--paper); }
.band-dark .cat-card:hover { background: rgba(250,247,240,0.04); }
.band-dark .cat-card p { color: rgba(250,247,240,0.7); }
.band-dark .cat-card .numeral { color: var(--paper); }
.band-dark .numeral { color: var(--paper); }

/* ---------- Mini map (review detail) ---------- */
.mini-map {
  position: relative;
  margin-top: 28px;
  height: 220px;
  border: 1px solid var(--ink);
  background: #ECE6D4;
  background-image:
    linear-gradient(to right, rgba(22,19,16,0.06) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(22,19,16,0.06) 1px, transparent 1px),
    radial-gradient(circle at 30% 40%, rgba(122,148,124,0.30), transparent 35%),
    radial-gradient(circle at 75% 65%, rgba(178,168,140,0.28), transparent 40%);
  background-size: 36px 36px, 36px 36px, auto, auto;
  overflow: hidden;
}
.mini-map .river {
  position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(118deg, transparent 42%, rgba(122,148,170,0.55) 42%, rgba(122,148,170,0.55) 45%, transparent 45%);
}
.mini-map .pin {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -100%);
}
.mini-map .pin .stick {
  width: 22px; height: 28px;
  border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
  background: var(--ink); border: 1px solid var(--ink);
  box-shadow: 0 4px 8px rgba(22,19,16,0.25);
  position: relative;
}
.mini-map .pin .stick::after {
  content: ""; position: absolute; inset: 6px; border-radius: 50%;
  background: var(--paper);
}
.mini-map .addr {
  position: absolute; left: 16px; bottom: 14px;
  background: var(--paper); border: 1px solid var(--ink);
  padding: 8px 12px;
  font-family: var(--serif); font-size: 15px;
  max-width: 75%;
}
.mini-map .addr .city {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 2px;
}


/* ============================================================
   RESPONSIVE — mobile + tablet
   ============================================================ */

/* Hide desktop nav links / show burger on tablet & below */
@media (max-width: 880px) {
  .nav-links { display: none !important; }
  .nav-burger { display: block; }
  .brand-logo { height: 44px; }
  .nav-row { padding: 12px 0 10px; gap: 12px; }
  .nav-thin { font-size: 10px; padding: 6px 0; }
}

/* ---------- Tablet breakpoint (≤880px) ---------- */
@media (max-width: 880px) {
  :root { --pad-x: clamp(16px, 4vw, 28px); }
  body { font-size: 17px; }

  /* Hero */
  .hero { padding: 36px 0 28px; gap: 20px; }
  .hero-meta { flex-wrap: wrap; gap: 8px 18px; font-size: 10px; letter-spacing: 0.22em; }
  .hero-sub { grid-template-columns: 1fr; gap: 18px; }
  .lede { font-size: 19px; }

  /* Section heads stack */
  .section-head { flex-direction: column; align-items: flex-start; gap: 8px; padding: 40px 0 14px; }

  /* Scores: 4-up → 2x2 */
  .scores { grid-template-columns: 1fr 1fr; }
  .score-cell { border-bottom: 1px solid var(--rule); }
  .score-cell:nth-child(2n) { border-right: 0; }
  .score-cell:nth-last-child(-n+2) { border-bottom: 0; }
  .score-num { font-size: 26px; }

  /* About */
  .about-grid { padding: 36px 0 48px; }
  .lede { font-size: 19px; }

  /* Categories detail rows */
  .cat-row { padding: 24px 0; }
  .cat-row .numeral { font-size: 44px; }
  .cat-row h3 { font-size: 24px; }
  .scale-row { grid-template-columns: 56px 1fr; gap: 14px; }

  /* Reviews head */
  .reviews-head { grid-template-columns: 1fr; padding: 36px 0 20px; }
  .reviews-head .view-switch { justify-self: start; }
  .filters { gap: 14px 22px; padding: 14px 0; }

  /* Reviews table → make horizontally scrollable container */
  .reviews-table-wrap {
    margin: 0 calc(-1 * var(--pad-x));
    padding: 0 var(--pad-x);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  table.reviews-table { min-width: 720px; }
  table.reviews-table th, table.reviews-table td { padding: 14px 10px; }
  table.reviews-table td.name { font-size: 19px; }

  /* Map view */
  .map-wrap { height: clamp(420px, 60vh, 600px); }
  .map-card { right: 12px; left: 12px; bottom: 12px; width: auto; padding: 16px; }
  .map-key { left: 12px; top: 12px; padding: 8px 10px; font-size: 9px; }

  /* Pagination */
  .pagination { padding: 18px 0 40px; }
  .pag-btn { padding: 10px 16px; font-size: 10px; }

  /* Detail page */
  .detail-head { padding: 32px 0 18px; }
  .detail-meta { gap: 14px; font-size: 10px; }
  .detail-grid { padding: 28px 0 56px; gap: 28px; }
  .detail-side .info-table .row { grid-template-columns: 110px 1fr; gap: 12px; padding: 12px 0; }
  .detail-side .info-table .row .v { font-size: 16px; }
  .score-line { grid-template-columns: 110px 1fr 50px; gap: 12px; }

  /* Review-toggle: stack tabs */
  .review-toggle button { padding: 10px 12px; font-size: 10px; min-width: 110px; }

  /* Slider arrows: smaller on mobile */
  .slider-arrow { width: 36px; height: 36px; font-size: 18px; }
  .slider-arrow.prev { left: 8px; }
  .slider-arrow.next { right: 8px; }

  /* Footer */
  .foot { flex-direction: column; gap: 8px; align-items: flex-start; padding: 22px 0; font-size: 10px; }

  /* Bands: tighten padding */
  .band-dark { padding: 36px calc(50vw - 50%) 44px; margin-top: 36px; }
  .band-dark--hero { padding-top: 4px; }
}

/* ---------- Phone breakpoint (≤560px) ---------- */
@media (max-width: 560px) {
  :root { --pad-x: clamp(14px, 4vw, 20px); }

  /* Hero display gets a touch smaller */
  .h-display { font-size: clamp(36px, 11vw, 56px); }
  .h-section { font-size: clamp(24px, 6vw, 32px); }
  .h-card { font-size: 22px; }
  .lede { font-size: 18px; line-height: 1.45; }

  /* Categories grid: 2-up → 1-up */
  .cat-grid { grid-template-columns: 1fr; }
  .cat-card { border-right: 0 !important; padding: 22px 16px; }
  .cat-card { border-bottom: 1px solid var(--rule); }
  .cat-card:last-child { border-bottom: 0; }
  .cat-card .numeral { font-size: 30px; }
  .cat-card h3 { font-size: 22px; margin: 10px 0 4px; }
  .cat-card p { font-size: 14px; }

  /* Filters: each filter full-width, sort/clear stack */
  .filter-group { min-width: 100% !important; }
  .filter-group input, .filter-group select { font-size: 16px; }

  /* Feature card photo aspect on phone */
  .feature-photo { aspect-ratio: 4 / 3; margin-bottom: 18px; }
  .feature-grid > * { padding: 28px 0; }

  /* Review detail */
  .detail-side .info-table .row { grid-template-columns: 96px 1fr; gap: 10px; }
  .detail-side .info-table .row .k { font-size: 9px; letter-spacing: 0.2em; }
  .score-line { grid-template-columns: 96px 1fr 44px; gap: 10px; }
  .score-line .k { font-size: 9px; }
  .score-line .v { font-size: 18px; }

  /* Mini-map */
  .mini-map { height: 180px; }
  .mini-map .addr { font-size: 13px; padding: 6px 10px; max-width: 80%; }

  /* Review toggle: 1 col stacked */
  .review-toggle { flex-direction: column; }
  .review-toggle button { border-right: 0; border-bottom: 1px solid var(--ink); flex: none; }
  .review-toggle button:last-child { border-bottom: 0; }

  /* Pagination: stack */
  .pagination { flex-wrap: wrap; gap: 12px; }
  .pag-btn { flex: 1 1 40%; }

  /* Tweaks panel: don't let it dwarf the screen */
}

/* Prevent horizontal page bleed from full-bleed bands when viewport is very narrow */
html, body { overflow-x: hidden; }
